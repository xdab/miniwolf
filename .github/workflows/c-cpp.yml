name: C/C++ CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
      with:
        submodules: true
    - name: install dependencies
      run: sudo apt-get update && sudo apt-get install -y libasound2-dev
    - name: build
      run: make build
    - name: test
      run: make test

  fmt-check:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: install dependencies
      run: |
          # .clang-format uses clang-format 22+ keys (BreakAfterOpenBracketFunction
          # et al.), so pin to the version the project is formatted with
          pip install clang-format==23.1.3
    - name: style check
      run: make fmt-check

  tidy:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
      with:
        submodules: true
    - name: install dependencies
      run: |
          sudo apt-get update && sudo apt-get install -y libasound2-dev
          # Same LLVM pin as the fmt-check job's clang-format: the version
          # the project is analyzed with
          pip install clang-tidy==23.1.3
    - name: static analysis
      run: |
        cmake -S . -B build -G "Unix Makefiles"
        make tidy
